/* 🚀 HERO */
.hero {
  padding: 30px 25px;
  border-radius: 12px;
  background: linear-gradient(135deg, #0f1115, #151821);
  border: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 30px;
}

.hero-buttons {
  margin-top: 15px;
}

/* 🔘 BUTTONS */
.btn {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 8px;
  background: #1a1d26;
  color: white !important;
  text-decoration: none;
  margin-right: 10px;
}

.btn-primary {
  background: #00ff99;
  color: black !important;
  font-weight: 600;
}

/* 📦 GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

/* 🧊 CARDS */
.card {
  padding: 16px;
  border-radius: 10px;
  background: #0f1115;
  border: 1px solid rgba(255,255,255,0.05);
  transition: 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #00ff99;
}

/* 📌 FOOTER CTA */
.footer-cta {
  margin-top: 30px;
  text-align: center;
  opacity: 0.8;
}
